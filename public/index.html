<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Nodestradamus Broadcast Terminal</title>

	<style>

		:root {
			--bg: #a58fab;
			--text: #ece6da;
			--muted: rgba(236, 230, 218, 0.58);
			--border: rgba(236, 230, 218, 0.18);

			/* SCREEN FIT FOR YOUR TEST IMAGE */
			--screen-left: 29.6%;
			--screen-top: 16.1%;
			--screen-width: 40.8%;
			--screen-height: 58.3%;
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			margin: 0;
			padding: 0;
			width: 100%;
			min-height: 100%;
			background: var(--bg);
			color: var(--text);
			font-family: "Courier New", monospace;
		}

		body {
			min-height: 100vh;
			overflow: hidden;
		}

		.site-shell {
			position: relative;
			min-height: 100vh;
			width: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 32px 24px;
		}

		/* ============================================================
		   HEADER / FOOTER
		   ============================================================ */

		.header,
		.footer {
			position: absolute;
			left: 40px;
			right: 40px;
			display: flex;
			justify-content: space-between;
			align-items: center;
			font-size: 12px;
			letter-spacing: 2px;
			z-index: 20;
			pointer-events: none;
			text-shadow: 0 0 12px rgba(0, 0, 0, 0.45);
		}

		.header {
			top: 28px;
		}

		.footer {
			bottom: 28px;
		}

		.signal,
		.footer div:last-child {
			opacity: 0.7;
		}

		/* ============================================================
		   MAIN TV AREA
		   ============================================================ */

		.terminal-stage {
			position: relative;
			width: min(94vw, 1500px);
		}

		.terminal-visual {
			position: relative;
			width: 100%;
		}

		.terminal-image {
			display: block;
			width: 100%;
			height: auto;
			user-select: none;
			pointer-events: none;
		}

		/* ============================================================
		   SCREEN OVERLAY
		   ============================================================ */

		.screen-window {
			position: absolute;
			left: var(--screen-left);
			top: var(--screen-top);
			width: var(--screen-width);
			height: var(--screen-height);

			border-radius: 5.5% / 7%;
			overflow: hidden;

			display: flex;
			align-items: center;
			justify-content: center;

			padding: clamp(18px, 2vw, 28px);

			background:
				radial-gradient(
					ellipse at center,
					rgba(206, 185, 219, 0.28) 0%,
					rgba(109, 87, 123, 0.30) 42%,
					rgba(34, 26, 39, 0.60) 100%
				);
			box-shadow:
				inset 0 0 35px rgba(0, 0, 0, 0.35),
				inset 0 0 80px rgba(0, 0, 0, 0.22);
		}

		.screen-window::before {
			content: "";
			position: absolute;
			inset: 0;
			pointer-events: none;
			background:
				linear-gradient(
					to bottom,
					rgba(255, 255, 255, 0.08) 0%,
					rgba(255, 255, 255, 0.02) 12%,
					rgba(0, 0, 0, 0.02) 45%,
					rgba(0, 0, 0, 0.12) 100%
				);
			mix-blend-mode: screen;
		}

		.screen-window::after {
			content: "";
			position: absolute;
			inset: 0;
			pointer-events: none;
			background:
				repeating-linear-gradient(
					to bottom,
					rgba(255, 255, 255, 0.035) 0px,
					rgba(255, 255, 255, 0.035) 1px,
					transparent 1px,
					transparent 4px
				);
			opacity: 0.7;
		}

		.screen-content {
			position: relative;
			z-index: 2;
			width: 100%;
			height: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
			text-align: center;
		}

		.project {
			transition: opacity 0.15s ease;
			max-width: 90%;
			text-shadow: 0 0 18px rgba(0, 0, 0, 0.5);
		}

		.project-number {
			font-size: clamp(11px, 1vw, 13px);
			letter-spacing: 4px;
			opacity: 0.65;
			margin-bottom: 16px;
		}

		.project-title {
			margin: 0;
			font-size: clamp(24px, 3.2vw, 52px);
			letter-spacing: 5px;
			line-height: 1.04;
		}

		.project-type {
			margin-top: 16px;
			font-size: clamp(11px, 1vw, 14px);
			letter-spacing: 3px;
			opacity: 0.72;
		}

		/* ============================================================
		   STATIC
		   ============================================================ */

		.static {
			position: absolute;
			inset: 0;
			display: none;
			z-index: 10;
			background:
				repeating-radial-gradient(
					circle at center,
					#ffffff 0px,
					#111111 1px,
					#868686 2px,
					#000000 3px
				);
			background-size: 5px 5px;
			animation: staticNoise 0.06s steps(2) infinite;
		}

		.static.active {
			display: block;
		}

		@keyframes staticNoise {
			0% { transform: translate(0, 0); }
			25% { transform: translate(-3px, 2px); }
			50% { transform: translate(2px, -2px); }
			75% { transform: translate(-1px, 3px); }
			100% { transform: translate(3px, -1px); }
		}

		/* ============================================================
		   NAV
		   ============================================================ */

		.nav-button {
			position: absolute;
			top: 43%;
			transform: translateY(-50%);
			width: 72px;
			height: 96px;
			border: 1px solid var(--border);
			background: rgba(20, 14, 22, 0.18);
			backdrop-filter: blur(4px);
			color: var(--text);
			font-family: "Courier New", monospace;
			font-size: 50px;
			line-height: 1;
			cursor: pointer;
			opacity: 0.72;
			transition:
				transform 0.18s ease,
				opacity 0.18s ease,
				background 0.18s ease;
			z-index: 15;
		}

		.nav-button:hover {
			opacity: 1;
			background: rgba(20, 14, 22, 0.34);
		}

		.nav-left {
			left: 6%;
			border-radius: 12px;
		}

		.nav-right {
			right: 6%;
			border-radius: 12px;
		}

		.nav-left:hover {
			transform: translateY(-50%) translateX(-4px);
		}

		.nav-right:hover {
			transform: translateY(-50%) translateX(4px);
		}

		/* ============================================================
		   MOBILE
		   ============================================================ */

		@media (max-width: 900px) {

			.header,
			.footer {
				left: 18px;
				right: 18px;
				font-size: 10px;
				letter-spacing: 1.5px;
			}

			.site-shell {
				padding: 70px 10px;
			}

			.terminal-stage {
				width: 100%;
			}

			.nav-button {
				width: 44px;
				height: 62px;
				font-size: 30px;
				top: 44%;
			}

			.nav-left {
				left: 1%;
			}

			.nav-right {
				right: 1%;
			}

			.project-title {
				letter-spacing: 3px;
			}

			.project-number,
			.project-type {
				letter-spacing: 2px;
			}
		}

	</style>
</head>

<body>

	<main class="site-shell">

		<header class="header">
			<div>NODESTRADAMUS INDUSTRIES</div>
			<div class="signal">SIGNAL : ONLINE</div>
		</header>

		<section class="terminal-stage">

			<button
				class="nav-button nav-left"
				id="previousButton"
				aria-label="Previous project"
			>
				‹
			</button>

			<div class="terminal-visual">

				<img
					class="terminal-image"
					src="tv-test.png"
					alt="Nodestradamus terminal"
				>

				<div class="screen-window">

					<div
						class="static"
						id="static"
					></div>

					<div class="screen-content">
						<div
							class="project"
							id="project"
						>
							<div
								class="project-number"
								id="projectNumber"
							>
								ARCHIVE 001
							</div>

							<h1
								class="project-title"
								id="projectTitle"
							>
								BROADCAST TERMINAL
							</h1>

							<div
								class="project-type"
								id="projectType"
							>
								VISUAL SYSTEM TEST
							</div>
						</div>
					</div>

				</div>

			</div>

			<button
				class="nav-button nav-right"
				id="nextButton"
				aria-label="Next project"
			>
				›
			</button>

		</section>

		<footer class="footer">
			<div>NDS-BT / REV 0.2</div>
			<div id="counter">01 / 03</div>
		</footer>

	</main>

	<script>

		const projects = [

			{
				number: "ARCHIVE 001",
				title: "BROADCAST TERMINAL",
				type: "VISUAL SYSTEM TEST"
			},

			{
				number: "ARCHIVE 002",
				title: "CONCERT VISUALS",
				type: "LIVE ENTERTAINMENT"
			},

			{
				number: "ARCHIVE 003",
				title: "EXPERIMENTAL",
				type: "3D / TOUCHDESIGNER"
			}

		];

		let currentProject = 0;
		let changing = false;

		const projectNumber = document.getElementById("projectNumber");
		const projectTitle = document.getElementById("projectTitle");
		const projectType = document.getElementById("projectType");
		const counter = document.getElementById("counter");
		const staticLayer = document.getElementById("static");

		function updateProject() {

			const project = projects[currentProject];

			projectNumber.textContent = project.number;
			projectTitle.textContent = project.title;
			projectType.textContent = project.type;

			counter.textContent =
				String(currentProject + 1).padStart(2, "0") +
				" / " +
				String(projects.length).padStart(2, "0");
		}

		function changeProject(direction) {

			if (changing) {
				return;
			}

			changing = true;
			staticLayer.classList.add("active");

			setTimeout(() => {

				currentProject += direction;

				if (currentProject >= projects.length) {
					currentProject = 0;
				}

				if (currentProject < 0) {
					currentProject = projects.length - 1;
				}

				updateProject();

			}, 250);

			setTimeout(() => {
				staticLayer.classList.remove("active");
				changing = false;
			}, 550);
		}

		document
			.getElementById("nextButton")
			.addEventListener("click", () => changeProject(1));

		document
			.getElementById("previousButton")
			.addEventListener("click", () => changeProject(-1));

		document.addEventListener("keydown", (event) => {

			if (event.key === "ArrowRight") {
				changeProject(1);
			}

			if (event.key === "ArrowLeft") {
				changeProject(-1);
			}

		});

		updateProject();

	</script>

</body>

</html>
