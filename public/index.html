<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">

	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0"
	>

	<title>Nodestradamus Broadcast Terminal</title>


	<style>

		/* ============================================================
		   GLOBAL
		   ============================================================ */

		* {
			box-sizing: border-box;
		}


		html,
		body {
			margin: 0;
			padding: 0;

			width: 100%;
			height: 100%;

			overflow: hidden;

			background: #000;

			font-family: "Courier New", monospace;
		}


		body {
			position: relative;
		}


		/* ============================================================
		   FULLSCREEN BACKGROUND IMAGE
		   ============================================================ */

		.background-image {
			position: absolute;

			inset: 0;

			width: 100%;
			height: 100%;

			object-fit: cover;
			object-position: center;

			display: block;

			user-select: none;
			pointer-events: none;

			z-index: 0;
		}


		/* ============================================================
		   CRT SCREEN
		   ============================================================ */

		.screen-window {
			position: absolute;

			overflow: hidden;

			border-radius: 7% / 9%;

			z-index: 5;

			display: flex;
			align-items: center;
			justify-content: center;

			background:
				radial-gradient(
					ellipse at center,
					rgba(140, 122, 150, 0.10) 0%,
					rgba(70, 55, 80, 0.18) 60%,
					rgba(10, 8, 12, 0.35) 100%
				);

			box-shadow:
				inset 0 0 40px rgba(0, 0, 0, 0.18),
				inset 0 0 100px rgba(0, 0, 0, 0.12);
		}


		/* CRT scanlines */

		.screen-window::after {
			content: "";

			position: absolute;
			inset: 0;

			pointer-events: none;

			z-index: 20;

			background:
				repeating-linear-gradient(
					to bottom,
					rgba(255, 255, 255, 0.025) 0px,
					rgba(255, 255, 255, 0.025) 1px,
					transparent 1px,
					transparent 4px
				);
		}


		/* ============================================================
		   PROJECT CONTENT
		   ============================================================ */

		.screen-content {
			position: relative;

			width: 100%;
			height: 100%;

			z-index: 2;

			display: flex;
			align-items: center;
			justify-content: center;

			padding: 7%;

			text-align: center;

			color: #eee8dd;
		}


		.project {
			max-width: 90%;

			text-shadow:
				0 2px 10px rgba(0, 0, 0, 0.5);

			transition:
				opacity 0.15s ease;
		}


		.project-number {
			margin-bottom: 18px;

			font-size: clamp(10px, 0.8vw, 14px);

			letter-spacing: 4px;

			opacity: 0.65;
		}


		.project-title {
			margin: 0;

			font-size: clamp(24px, 3.1vw, 58px);

			line-height: 1;

			letter-spacing: 5px;
		}


		.project-type {
			margin-top: 18px;

			font-size: clamp(10px, 0.8vw, 14px);

			letter-spacing: 3px;

			opacity: 0.7;
		}


		/* ============================================================
		   STATIC
		   ============================================================ */

		.static {
			position: absolute;

			inset: 0;

			display: none;

			z-index: 15;

			background:
				repeating-radial-gradient(
					circle at center,
					#ffffff 0px,
					#000000 1px,
					#777777 2px,
					#111111 3px
				);

			background-size: 5px 5px;

			animation:
				staticNoise 0.06s steps(2) infinite;
		}


		.static.active {
			display: block;
		}


		@keyframes staticNoise {

			0% {
				transform: translate(0, 0);
			}

			25% {
				transform: translate(-4px, 2px);
			}

			50% {
				transform: translate(3px, -3px);
			}

			75% {
				transform: translate(-2px, 4px);
			}

			100% {
				transform: translate(4px, -2px);
			}

		}


		/* ============================================================
		   HEADER
		   ============================================================ */

		.header {
			position: absolute;

			top: 28px;
			left: 36px;
			right: 36px;

			z-index: 30;

			display: flex;
			align-items: center;
			justify-content: space-between;

			color: #eee8dd;

			font-size: 12px;

			letter-spacing: 2px;

			pointer-events: none;

			text-shadow:
				0 2px 8px rgba(0, 0, 0, 0.6);
		}


		.signal {
			opacity: 0.7;
		}


		/* ============================================================
		   FOOTER
		   ============================================================ */

		.footer {
			position: absolute;

			bottom: 28px;
			left: 36px;
			right: 36px;

			z-index: 30;

			display: flex;
			align-items: center;
			justify-content: space-between;

			color: #eee8dd;

			font-size: 11px;

			letter-spacing: 2px;

			opacity: 0.7;

			pointer-events: none;

			text-shadow:
				0 2px 8px rgba(0, 0, 0, 0.6);
		}


		/* ============================================================
		   NAVIGATION
		   ============================================================ */

		.nav-button {
			position: absolute;

			top: 50%;

			transform: translateY(-50%);

			z-index: 40;

			width: 70px;
			height: 110px;

			border: none;

			background: transparent;

			color: #eee8dd;

			font-family: "Courier New", monospace;

			font-size: 64px;

			cursor: pointer;

			opacity: 0.55;

			text-shadow:
				0 3px 12px rgba(0, 0, 0, 0.7);

			transition:
				opacity 0.2s ease,
				transform 0.2s ease;
		}


		.nav-button:hover {
			opacity: 1;
		}


		.nav-left {
			left: 24px;
		}


		.nav-right {
			right: 24px;
		}


		.nav-left:hover {
			transform:
				translateY(-50%)
				translateX(-6px);
		}


		.nav-right:hover {
			transform:
				translateY(-50%)
				translateX(6px);
		}


		/* ============================================================
		   MOBILE
		   ============================================================ */

		@media (max-width: 700px) {

			.header {
				top: 16px;
				left: 16px;
				right: 16px;

				font-size: 9px;
			}


			.footer {
				bottom: 16px;
				left: 16px;
				right: 16px;

				font-size: 9px;
			}


			.nav-button {
				width: 40px;

				font-size: 40px;
			}


			.nav-left {
				left: 2px;
			}


			.nav-right {
				right: 2px;
			}


			.project-number {
				margin-bottom: 8px;
			}


			.project-type {
				margin-top: 8px;
			}

		}

	</style>

</head>


<body>


	<!-- ============================================================
	     FULLSCREEN TERMINAL RENDER
	     ============================================================ -->

	<img
		id="backgroundImage"
		class="background-image"
		src="tv-test.png"
		alt=""
	>


	<!-- ============================================================
	     CRT CONTENT AREA
	     ============================================================ -->

	<div
		id="screenWindow"
		class="screen-window"
	>

		<div
			id="static"
			class="static"
		></div>


		<div class="screen-content">

			<div
				id="project"
				class="project"
			>

				<div
					id="projectNumber"
					class="project-number"
				>
					ARCHIVE 001
				</div>


				<h1
					id="projectTitle"
					class="project-title"
				>
					BROADCAST TERMINAL
				</h1>


				<div
					id="projectType"
					class="project-type"
				>
					VISUAL SYSTEM TEST
				</div>

			</div>

		</div>

	</div>


	<!-- ============================================================
	     SITE TEXT
	     ============================================================ -->

	<header class="header">

		<div>
			NODESTRADAMUS INDUSTRIES
		</div>

		<div class="signal">
			SIGNAL : ONLINE
		</div>

	</header>


	<!-- ============================================================
	     NAV
	     ============================================================ -->

	<button
		class="nav-button nav-left"
		id="previousButton"
		aria-label="Previous project"
	>
		‹
	</button>


	<button
		class="nav-button nav-right"
		id="nextButton"
		aria-label="Next project"
	>
		›
	</button>


	<footer class="footer">

		<div>
			NDS-BT / REV 0.3
		</div>

		<div id="counter">
			01 / 03
		</div>

	</footer>



	<script>

		/* ============================================================
		   PROJECTS
		   ============================================================ */

		const projects = [

			{
				number: "ARCHIVE 001",
				title: "BROADCAST TERMINAL",
				type: "VISUAL SYSTEM TEST"
			},

			{
				number: "ARCHIVE 002",
				title: "CONCERT VISUALS",
				type: "LIVE ENTERTAINMENT"
			},

			{
				number: "ARCHIVE 003",
				title: "EXPERIMENTAL",
				type: "3D / TOUCHDESIGNER"
			}

		];


		let currentProject = 0;
		let changing = false;


		const backgroundImage =
			document.getElementById("backgroundImage");


		const screenWindow =
			document.getElementById("screenWindow");


		const projectNumber =
			document.getElementById("projectNumber");


		const projectTitle =
			document.getElementById("projectTitle");


		const projectType =
			document.getElementById("projectType");


		const counter =
			document.getElementById("counter");


		const staticLayer =
			document.getElementById("static");



		/* ============================================================
		   SCREEN POSITION
		   
		   These values describe the CRT screen location
		   inside the ORIGINAL 1920x1080 render.
		   ============================================================ */

		const SCREEN = {

			x: 570,
			y: 177,

			width: 780,
			height: 640

		};



		/* ============================================================
		   KEEP HTML SCREEN REGISTERED TO BACKGROUND IMAGE
		   ============================================================ */

		function positionScreen() {

			const naturalWidth =
				backgroundImage.naturalWidth || 1920;


			const naturalHeight =
				backgroundImage.naturalHeight || 1080;


			const viewportWidth =
				window.innerWidth;


			const viewportHeight =
				window.innerHeight;



			/*
				object-fit: cover

				Find scale necessary to completely fill browser.
			*/

			const scale = Math.max(

				viewportWidth / naturalWidth,

				viewportHeight / naturalHeight

			);



			const renderedWidth =
				naturalWidth * scale;


			const renderedHeight =
				naturalHeight * scale;



			/*
				Image is centered.

				These offsets account for cropping caused
				by different browser aspect ratios.
			*/

			const offsetX =
				(viewportWidth - renderedWidth) / 2;


			const offsetY =
				(viewportHeight - renderedHeight) / 2;



			screenWindow.style.left =
				(offsetX + SCREEN.x * scale) + "px";


			screenWindow.style.top =
				(offsetY + SCREEN.y * scale) + "px";


			screenWindow.style.width =
				(SCREEN.width * scale) + "px";


			screenWindow.style.height =
				(SCREEN.height * scale) + "px";

		}



		backgroundImage.addEventListener(
			"load",
			positionScreen
		);


		window.addEventListener(
			"resize",
			positionScreen
		);


		positionScreen();



		/* ============================================================
		   UPDATE PROJECT
		   ============================================================ */

		function updateProject() {

			const project =
				projects[currentProject];


			projectNumber.textContent =
				project.number;


			projectTitle.textContent =
				project.title;


			projectType.textContent =
				project.type;


			counter.textContent =

				String(
					currentProject + 1
				).padStart(2, "0")

				+

				" / "

				+

				String(
					projects.length
				).padStart(2, "0");

		}



		/* ============================================================
		   CHANGE PROJECT
		   ============================================================ */

		function changeProject(direction) {

			if (changing) {
				return;
			}


			changing = true;


			staticLayer.classList.add(
				"active"
			);



			setTimeout(() => {

				currentProject += direction;


				if (
					currentProject >= projects.length
				) {

					currentProject = 0;

				}


				if (
					currentProject < 0
				) {

					currentProject =
						projects.length - 1;

				}


				updateProject();

			}, 250);



			setTimeout(() => {

				staticLayer.classList.remove(
					"active"
				);


				changing = false;

			}, 550);

		}



		/* ============================================================
		   BUTTONS
		   ============================================================ */

		document
			.getElementById("nextButton")
			.addEventListener(
				"click",
				() => changeProject(1)
			);


		document
			.getElementById("previousButton")
			.addEventListener(
				"click",
				() => changeProject(-1)
			);



		/* ============================================================
		   KEYBOARD
		   ============================================================ */

		document.addEventListener(
			"keydown",
			(event) => {

				if (
					event.key === "ArrowRight"
				) {

					changeProject(1);

				}


				if (
					event.key === "ArrowLeft"
				) {

					changeProject(-1);

				}

			}
		);



		updateProject();

	</script>


</body>

</html>
