<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">

	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0"
	>

	<title>Nodestradamus Broadcast Terminal</title>


	<style>

		/* ============================================================
		   GLOBAL
		   ============================================================ */

		* {
			box-sizing: border-box;
		}

		html,
		body {
			margin: 0;
			padding: 0;

			width: 100%;
			height: 100%;

			overflow: hidden;

			background: #000;

			font-family: "Courier New", monospace;
		}

		body {
			position: relative;
		}


		/* ============================================================
		   FULL FRAME IMAGE LAYERS

		   JavaScript handles the actual sizing so normal screens can
		   use COVER while ultrawides use vertical fit.
		   ============================================================ */

		.full-frame {
			position: absolute;

			display: block;

			user-select: none;
			pointer-events: none;

			max-width: none;
			max-height: none;
		}


		.shell-image {
			z-index: 20;
		}


		.button-state-image {
			z-index: 25;
		}


		/* ============================================================
		   CRT SCREEN
		   ============================================================ */

		.screen-window {
			position: absolute;

			overflow: hidden;

			z-index: 10;

			display: flex;
			align-items: center;
			justify-content: center;

			border-radius: 2.5% / 5.5%;

			background: #050505;

			box-shadow:
				inset 0 0 40px rgba(0, 0, 0, 0.25),
				inset 0 0 120px rgba(0, 0, 0, 0.18);
		}


		/* ============================================================
		   CRT SCANLINES
		   ============================================================ */

		.screen-window::after {
			content: "";

			position: absolute;
			inset: 0;

			z-index: 20;

			pointer-events: none;

			background:
				repeating-linear-gradient(
					to bottom,
					rgba(255, 255, 255, 0.025) 0px,
					rgba(255, 255, 255, 0.025) 1px,
					transparent 1px,
					transparent 4px
				);

			opacity: 0.65;
		}


		/* ============================================================
		   PROJECT CONTENT
		   ============================================================ */

		.screen-content {
			position: relative;

			z-index: 2;

			width: 100%;
			height: 100%;

			display: flex;
			align-items: center;
			justify-content: center;

			padding: 7%;

			text-align: center;

			color: #d8d8d8;
		}


		.project {
			width: 100%;
			max-width: 90%;

			text-shadow:
				0 0 12px rgba(255, 255, 255, 0.08),
				0 2px 8px rgba(0, 0, 0, 0.85);
		}


		.project-number {
			margin-bottom: 18px;

			font-size: clamp(10px, 0.8vw, 14px);

			letter-spacing: 4px;

			opacity: 0.58;
		}


		.project-title {
			margin: 0;

			font-size: clamp(26px, 3vw, 56px);

			line-height: 1;

			letter-spacing: 5px;

			font-weight: normal;
		}


		.project-type {
			margin-top: 18px;

			font-size: clamp(10px, 0.8vw, 14px);

			letter-spacing: 3px;

			opacity: 0.62;
		}


		/* ============================================================
		   STATIC
		   ============================================================ */

		.static {
			position: absolute;
			inset: 0;

			display: none;

			z-index: 15;

			background:
				repeating-radial-gradient(
					circle at center,
					#ffffff 0px,
					#111111 1px,
					#777777 2px,
					#050505 3px
				);

			background-size: 5px 5px;

			animation:
				staticNoise 0.055s steps(2) infinite;
		}


		.static.active {
			display: block;
		}


		@keyframes staticNoise {

			0% {
				transform: translate(0, 0);
			}

			25% {
				transform: translate(-4px, 2px);
			}

			50% {
				transform: translate(3px, -3px);
			}

			75% {
				transform: translate(-2px, 4px);
			}

			100% {
				transform: translate(4px, -2px);
			}

		}


		/* ============================================================
		   INVISIBLE BUTTON HITBOXES
		   ============================================================ */

		.hardware-hitbox {
			position: absolute;

			z-index: 40;

			border: none;

			padding: 0;
			margin: 0;

			background: transparent;

			cursor: pointer;

			touch-action: none;
		}


		.hardware-hitbox:focus-visible {
			outline: 1px solid rgba(255, 255, 255, 0.3);
		}


		/* ============================================================
		   HEADER
		   ============================================================ */

		.header {
			position: absolute;

			top: 28px;
			left: 36px;
			right: 36px;

			z-index: 50;

			display: flex;
			align-items: center;
			justify-content: space-between;

			color: #cfcfcf;

			font-size: 12px;

			letter-spacing: 2px;

			pointer-events: none;

			text-shadow:
				0 2px 8px rgba(0, 0, 0, 0.8);
		}


		.signal {
			opacity: 0.65;
		}


		/* ============================================================
		   FOOTER
		   ============================================================ */

		.footer {
			position: absolute;

			bottom: 28px;
			left: 36px;
			right: 36px;

			z-index: 50;

			display: flex;
			align-items: center;
			justify-content: space-between;

			color: #cfcfcf;

			font-size: 11px;

			letter-spacing: 2px;

			opacity: 0.65;

			pointer-events: none;

			text-shadow:
				0 2px 8px rgba(0, 0, 0, 0.8);
		}


		/* ============================================================
		   MOBILE
		   ============================================================ */

		@media (max-width: 700px) {

			.header {
				top: 16px;
				left: 16px;
				right: 16px;

				font-size: 9px;
			}

			.footer {
				bottom: 16px;
				left: 16px;
				right: 16px;

				font-size: 9px;
			}

			.project-number {
				margin-bottom: 8px;
			}

			.project-type {
				margin-top: 8px;
			}

		}

	</style>

</head>


<body>


	<!-- ============================================================
	     CRT CONTENT
	     ============================================================ -->

	<div
		id="screenWindow"
		class="screen-window"
	>

		<div
			id="static"
			class="static"
		></div>


		<div class="screen-content">

			<div class="project">

				<div
					id="projectNumber"
					class="project-number"
				>
					ARCHIVE 001
				</div>


				<h1
					id="projectTitle"
					class="project-title"
				>
					BROADCAST TERMINAL
				</h1>


				<div
					id="projectType"
					class="project-type"
				>
					VISUAL SYSTEM TEST
				</div>

			</div>

		</div>

	</div>



	<!-- ============================================================
	     MAIN TV SHELL
	     ============================================================ -->

	<img
		id="shellImage"
		class="full-frame shell-image"
		src="tv-shell6.png"
		alt=""
	>



	<!-- ============================================================
	     LEFT BUTTON STATE
	     ============================================================ -->

	<img
		id="leftButtonImage"
		class="full-frame button-state-image"
		src="buttons/btn-left-up.png"
		alt=""
	>



	<!-- ============================================================
	     RIGHT BUTTON STATE
	     ============================================================ -->

	<img
		id="rightButtonImage"
		class="full-frame button-state-image"
		src="buttons/btn-right-up.png"
		alt=""
	>



	<!-- ============================================================
	     INVISIBLE BUTTON HITBOXES
	     ============================================================ -->

	<button
		id="leftButtonHitbox"
		class="hardware-hitbox"
		aria-label="Previous project"
	></button>


	<button
		id="rightButtonHitbox"
		class="hardware-hitbox"
		aria-label="Next project"
	></button>



	<!-- ============================================================
	     HEADER
	     ============================================================ -->

	<header class="header">

		<div>
			NODESTRADAMUS INDUSTRIES
		</div>

		<div class="signal">
			SIGNAL : ONLINE
		</div>

	</header>



	<!-- ============================================================
	     FOOTER
	     ============================================================ -->

	<footer class="footer">

		<div>
			NDS-BT / REV 1.2
		</div>

		<div id="counter">
			01 / 03
		</div>

	</footer>



	<script>


		/* ============================================================
		   PROJECT DATA
		   ============================================================ */

		const projects = [

			{
				number: "ARCHIVE 001",
				title: "BROADCAST TERMINAL",
				type: "VISUAL SYSTEM TEST"
			},

			{
				number: "ARCHIVE 002",
				title: "CONCERT VISUALS",
				type: "LIVE ENTERTAINMENT"
			},

			{
				number: "ARCHIVE 003",
				title: "EXPERIMENTAL",
				type: "3D / TOUCHDESIGNER"
			}

		];



		/* ============================================================
		   BUTTON IMAGES
		   ============================================================ */

		const BUTTON_IMAGES = {

			left: {

				up:
					"buttons/btn-left-up.png",

				down:
					"buttons/btn-left-down.png"

			},


			right: {

				up:
					"buttons/btn-right-up.png",

				down:
					"buttons/btn-right-down.png"

			}

		};



		/* ============================================================
		   BUTTON SOUNDS
		   ============================================================ */

		const BUTTON_SOUND_FILES = [

			"audio/button-click-1.mp3",

			"audio/button-click-2.mp3",

			"audio/button-click-3.mp3",

			"audio/button-click-4.mp3"

		];


		const buttonSounds =
			BUTTON_SOUND_FILES.map(
				(file) => {

					const sound =
						new Audio(file);

					sound.preload =
						"auto";

					return sound;

				}
			);


		let nextButtonSound = 0;



		/* ============================================================
		   PLAY NEXT SOUND
		   ============================================================ */

		function playNextButtonSound() {


			const sound =
				buttonSounds[
					nextButtonSound
				];


			sound.currentTime = 0;


			sound
				.play()
				.catch(
					() => {}
				);


			nextButtonSound++;


			if (
				nextButtonSound >=
				buttonSounds.length
			) {

				nextButtonSound = 0;

			}

		}



		/* ============================================================
		   STATE
		   ============================================================ */

		let currentProject = 0;

		let changing = false;

		let leftKeyboardPressed = false;

		let rightKeyboardPressed = false;



		/* ============================================================
		   ELEMENTS
		   ============================================================ */

		const shellImage =
			document.getElementById(
				"shellImage"
			);


		const screenWindow =
			document.getElementById(
				"screenWindow"
			);


		const staticLayer =
			document.getElementById(
				"static"
			);


		const projectNumber =
			document.getElementById(
				"projectNumber"
			);


		const projectTitle =
			document.getElementById(
				"projectTitle"
			);


		const projectType =
			document.getElementById(
				"projectType"
			);


		const counter =
			document.getElementById(
				"counter"
			);


		const leftButtonImage =
			document.getElementById(
				"leftButtonImage"
			);


		const rightButtonImage =
			document.getElementById(
				"rightButtonImage"
			);


		const leftButtonHitbox =
			document.getElementById(
				"leftButtonHitbox"
			);


		const rightButtonHitbox =
			document.getElementById(
				"rightButtonHitbox"
			);



		/* ============================================================
		   DESIGN SIZE
		   ============================================================ */

		const DESIGN_WIDTH = 1920;

		const DESIGN_HEIGHT = 1080;



		/* ============================================================
		   ULTRAWIDE THRESHOLD

		   Below 2.20 = old COVER behavior.

		   Above 2.20 = fit vertically and allow black side bars.
		   ============================================================ */

		const ULTRAWIDE_THRESHOLD = 2.20;



		/* ============================================================
		   CRT SCREEN
		   ============================================================ */

		const SCREEN = {

			x: 462,
			y: 214,

			width: 995,
			height: 457

		};



		/* ============================================================
		   BUTTON HITBOXES
		   ============================================================ */

		const LEFT_BUTTON = {

			x: 660,
			y: 895,

			width: 115,
			height: 90

		};


		const RIGHT_BUTTON = {

			x: 1148,
			y: 895,

			width: 115,
			height: 90

		};



		/* ============================================================
		   FIT CALCULATION

		   NORMAL / 16:9:
		   Behaves like the original object-fit: cover.

		   ULTRAWIDE:
		   Fits based on vertical height so nothing is cropped.
		   ============================================================ */

		function getFitMetrics() {


			const naturalWidth =
				shellImage.naturalWidth ||
				DESIGN_WIDTH;


			const naturalHeight =
				shellImage.naturalHeight ||
				DESIGN_HEIGHT;


			const viewportWidth =
				window.innerWidth;


			const viewportHeight =
				window.innerHeight;


			const viewportAspect =
				viewportWidth /
				viewportHeight;



			let scale;



			/* ========================================================
			   ULTRAWIDE

			   Height-fit.
			   ======================================================== */

			if (
				viewportAspect >
				ULTRAWIDE_THRESHOLD
			) {


				scale =
					viewportHeight /
					naturalHeight;


			}


			/* ========================================================
			   NORMAL SCREEN

			   Old cover behavior.

			   This gives the slight crop / zoom you liked.
			   ======================================================== */

			else {


				scale =
					Math.max(

						viewportWidth /
							naturalWidth,

						viewportHeight /
							naturalHeight

					);


			}



			const renderedWidth =
				naturalWidth *
				scale;


			const renderedHeight =
				naturalHeight *
				scale;



			const offsetX =
				(
					viewportWidth -
					renderedWidth
				) / 2;


			const offsetY =
				(
					viewportHeight -
					renderedHeight
				) / 2;



			return {

				scale,
				offsetX,
				offsetY,
				renderedWidth,
				renderedHeight

			};

		}



		/* ============================================================
		   POSITION FULL-FRAME PNG LAYERS

		   This guarantees shell and both button images always use the
		   exact same scale and crop.
		   ============================================================ */

		function positionFullFrameImage(
			element
		) {


			const fit =
				getFitMetrics();


			element.style.left =
				fit.offsetX + "px";


			element.style.top =
				fit.offsetY + "px";


			element.style.width =
				fit.renderedWidth + "px";


			element.style.height =
				fit.renderedHeight + "px";

		}



		/* ============================================================
		   POSITION IMAGE-SPACE RECTANGLE
		   ============================================================ */

		function applyRect(
			element,
			rect
		) {


			const fit =
				getFitMetrics();


			element.style.left =

				(
					fit.offsetX +
					rect.x *
					fit.scale
				)

				+ "px";


			element.style.top =

				(
					fit.offsetY +
					rect.y *
					fit.scale
				)

				+ "px";


			element.style.width =

				(
					rect.width *
					fit.scale
				)

				+ "px";


			element.style.height =

				(
					rect.height *
					fit.scale
				)

				+ "px";

		}



		/* ============================================================
		   POSITION EVERYTHING
		   ============================================================ */

		function positionInterface() {


			positionFullFrameImage(
				shellImage
			);


			positionFullFrameImage(
				leftButtonImage
			);


			positionFullFrameImage(
				rightButtonImage
			);



			applyRect(
				screenWindow,
				SCREEN
			);


			applyRect(
				leftButtonHitbox,
				LEFT_BUTTON
			);


			applyRect(
				rightButtonHitbox,
				RIGHT_BUTTON
			);

		}



		/* ============================================================
		   PROJECT DISPLAY
		   ============================================================ */

		function updateProject() {


			const project =
				projects[
					currentProject
				];


			projectNumber.textContent =
				project.number;


			projectTitle.textContent =
				project.title;


			projectType.textContent =
				project.type;


			counter.textContent =

				String(
					currentProject + 1
				).padStart(
					2,
					"0"
				)

				+

				" / "

				+

				String(
					projects.length
				).padStart(
					2,
					"0"
				);

		}



		/* ============================================================
		   CHANGE PROJECT
		   ============================================================ */

		function changeProject(
			direction
		) {


			if (changing) {
				return;
			}


			changing = true;


			staticLayer.classList.add(
				"active"
			);



			setTimeout(
				() => {


					currentProject +=
						direction;


					if (
						currentProject >=
						projects.length
					) {

						currentProject = 0;

					}


					if (
						currentProject < 0
					) {

						currentProject =
							projects.length - 1;

					}


					updateProject();


				},
				250
			);



			setTimeout(
				() => {


					staticLayer.classList.remove(
						"active"
					);


					changing = false;


				},
				550
			);

		}



		/* ============================================================
		   BUTTON VISUALS
		   ============================================================ */

		function pressLeftButton() {

			leftButtonImage.src =
				BUTTON_IMAGES.left.down;

		}


		function releaseLeftButton() {

			leftButtonImage.src =
				BUTTON_IMAGES.left.up;

		}


		function pressRightButton() {

			rightButtonImage.src =
				BUTTON_IMAGES.right.down;

		}


		function releaseRightButton() {

			rightButtonImage.src =
				BUTTON_IMAGES.right.up;

		}



		/* ============================================================
		   POINTER LEFT
		   ============================================================ */

		leftButtonHitbox.addEventListener(
			"pointerdown",
			(event) => {


				event.preventDefault();


				pressLeftButton();


				playNextButtonSound();


				if (
					leftButtonHitbox.setPointerCapture
				) {

					leftButtonHitbox.setPointerCapture(
						event.pointerId
					);

				}


				changeProject(-1);


			}
		);


		leftButtonHitbox.addEventListener(
			"pointerup",
			releaseLeftButton
		);


		leftButtonHitbox.addEventListener(
			"pointercancel",
			releaseLeftButton
		);


		leftButtonHitbox.addEventListener(
			"lostpointercapture",
			releaseLeftButton
		);



		/* ============================================================
		   POINTER RIGHT
		   ============================================================ */

		rightButtonHitbox.addEventListener(
			"pointerdown",
			(event) => {


				event.preventDefault();


				pressRightButton();


				playNextButtonSound();


				if (
					rightButtonHitbox.setPointerCapture
				) {

					rightButtonHitbox.setPointerCapture(
						event.pointerId
					);

				}


				changeProject(1);


			}
		);


		rightButtonHitbox.addEventListener(
			"pointerup",
			releaseRightButton
		);


		rightButtonHitbox.addEventListener(
			"pointercancel",
			releaseRightButton
		);


		rightButtonHitbox.addEventListener(
			"lostpointercapture",
			releaseRightButton
		);



		/* ============================================================
		   KEYBOARD DOWN
		   ============================================================ */

		document.addEventListener(
			"keydown",
			(event) => {


				if (event.repeat) {
					return;
				}



				if (
					event.key ===
					"ArrowLeft"
				) {


					event.preventDefault();


					if (
						leftKeyboardPressed
					) {
						return;
					}


					leftKeyboardPressed =
						true;


					pressLeftButton();


					playNextButtonSound();


					changeProject(-1);

				}



				if (
					event.key ===
					"ArrowRight"
				) {


					event.preventDefault();


					if (
						rightKeyboardPressed
					) {
						return;
					}


					rightKeyboardPressed =
						true;


					pressRightButton();


					playNextButtonSound();


					changeProject(1);

				}


			}
		);



		/* ============================================================
		   KEYBOARD UP
		   ============================================================ */

		document.addEventListener(
			"keyup",
			(event) => {


				if (
					event.key ===
					"ArrowLeft"
				) {


					event.preventDefault();


					leftKeyboardPressed =
						false;


					releaseLeftButton();

				}



				if (
					event.key ===
					"ArrowRight"
				) {


					event.preventDefault();


					rightKeyboardPressed =
						false;


					releaseRightButton();

				}


			}
		);



		/* ============================================================
		   SAFETY RESET
		   ============================================================ */

		window.addEventListener(
			"blur",
			() => {


				leftKeyboardPressed =
					false;


				rightKeyboardPressed =
					false;


				releaseLeftButton();


				releaseRightButton();

			}
		);



		/* ============================================================
		   INITIALIZE
		   ============================================================ */

		shellImage.addEventListener(
			"load",
			positionInterface
		);


		window.addEventListener(
			"resize",
			positionInterface
		);


		updateProject();


		positionInterface();


	</script>


</body>

</html>
